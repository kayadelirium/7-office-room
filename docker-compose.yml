  #   container_name: ollama
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   restart: unless-stopped
  #
  #   # ── GPU (раскомментировать на Linux с NVIDIA) ───────────────────────
