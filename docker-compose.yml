services:

  # ── Web-сервер (FastAPI + React) ──────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: room-server
    ports:
      - "8765:8765"
    restart: unless-stopped

    # ── BLE на Linux ─────────────────────────────────────────────────────────
    # bleak требует BlueZ и D-Bus. На macOS Docker BLE недоступен из контейнера
    # (нет доступа к CoreBluetooth). Раскомментировать на Linux:
    # network_mode: host        # BLE через host-сеть
    # privileged: true
    # volumes:
    #   - /var/run/dbus:/var/run/dbus


  # ── Ollama (LLM) — нужна только для голосового помощника ────────────────
  # ollama:
